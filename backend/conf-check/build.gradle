plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation project(':backend:domain')

    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    // Standalone Jackson for the 'pointer' subcommand's JSON parsing / RFC 6901 pointer resolution
    // :backend:conf-check must not depend on :backend:server, so this is a separate,
    // matching-generation version rather than the Quarkus-BOM-managed one backend gets via
    // quarkus-rest-jackson (backend runs Quarkus 3.33.2, whose platform BOM manages Jackson 2.18.x)
    // — pick a current 2.18.x release for parity; bump alongside backend's BOM if it moves.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.2'

    // YAML parsing for the config gate's AppConfigReader. Same 2.18.x generation as
    // jackson-databind above, for the same reason: :backend:conf-check must not depend on
    // :backend:server's Quarkus BOM.
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.18.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.wiremock:wiremock:3.13.2'
}

group 'org.yardship'
version '1.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'org.yardship.confcheck.Main'
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()

    // PrometheusExpositionCopyFidelityTests reads the backend's copy of the exposition parser off
    // disk to prove this module's hand copy has not drifted from it (issue 05: :backend:conf-check
    // cannot depend on :backend:server, so the parser is duplicated deliberately). Those files are
    // not otherwise inputs to this task, so without declaring them Gradle would consider the tests
    // up-to-date after a backend-side edit and skip the very run that would catch the drift.
    inputs.files(fileTree("${rootDir}/backend/server/src/main/java/org/yardship/adapters/out/versionsource/current/httpprometheus") {
        include 'PrometheusExposition.java', 'PrometheusSample.java'
    }).withPropertyName('backendPrometheusParserCopies').withPathSensitivity(PathSensitivity.RELATIVE)

    // The unit-only lane excludes integration and command-wiring tests.
    if (project.hasProperty('unitTestsOnly')) {
        filter {
            includeTestsMatching 'org.yardship.unit.*'
        }
    }
}

graalvmNative {
    binaries {
        main {
            imageName = 'conf-check'
            mainClass = 'org.yardship.confcheck.Main'
            buildArgs.add('--no-fallback')
        }
    }
}
