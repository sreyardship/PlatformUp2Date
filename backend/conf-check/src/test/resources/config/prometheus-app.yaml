# Fixture exercising the http-prometheus current source's config surface (ADR-0033 / slice 04).
#
# A single app whose current source is http-prometheus, with metric, an optional version-label,
# an optional current.regex, and a labels: selector (including the underscore key 'pod_name' --
# the case slice 02's binding gate proved is at risk of being silently mangled), so:
#   - YamlAppConfigReaderPrometheusSurfaceIT asserts every field survives the real YAML-to-AppConfig
#     round trip, with labels' keys verbatim;
#   - ConfigCommandWiringPrometheusSurfaceTests asserts the config gate's prometheus surface
#     actually RUNS against a real parsed app (rather than reporting "not applicable").
#
# latest.type is deliberately github-release (no CLI-transparent latest validator, see
# mixed-apps.yaml's gitea-oci entry) so the regex surface stays not-applicable and no unwanted live
# fetch happens when this fixture is driven through ConfigCommand. current.url is never actually
# fetched by this slice's prometheus surface (structural-only check; live extraction is slice 05),
# so it need not resolve to anything real either.
platform-config:
  apps:
    - name: blackbox-exporter
      current:
        type: http-prometheus
        url: http://localhost:9115/metrics
        metric: blackbox_exporter_build_info
        version-label: version
        regex: '(\d+\.\d+\.\d+)'
        labels:
          job: blackbox
          pod_name: blackbox-0
      latest:
        type: github-release
        repo: prometheus/blackbox_exporter
