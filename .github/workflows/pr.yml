name: PR checks

on:
  pull_request:

# Cancel a still-running check set when the PR gets a new push; only the latest
# commit on a given PR needs to hold up the merge gate.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only by default. Fork PRs get the restricted, read-only default token
# automatically; this workflow never escalates that, and it never runs as
# pull_request_target, so it never sees a write-capable token or repo secrets.
permissions:
  contents: read

jobs:
  # Unit + JVM integration tests (backend) and the frontend test suite. The
  # Valkey-backed integration tests (e.g. ValkeyScrapeStateStoreIT) use Quarkus
  # Dev Services: GitHub-hosted runners ship Docker, so `quarkus-redis-client`
  # auto-starts a throwaway Valkey container for the test JVM with no
  # `quarkus.redis.hosts` override and no explicit service block needed here.
  fast:
    name: fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.14.4'

      - name: Build identity CLI tests
        run: bash ci/test-resolve-build-version.sh

      - name: Native Dockerfile loader per target architecture (patcher stage only)
        run: bash ci/test-native-dockerfile-arch.sh

      - name: Backend unit + integration tests
        run: gradle --no-daemon :backend:test

      - name: Backend build identity injection + regeneration (packaged JVM endpoint)
        run: bash ci/check-backend-build-version.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Frontend tests (including build identity regeneration)
        working-directory: frontend
        run: yarn test

      - name: Frontend image contract (build identity, both nginx configs, restricted runtime; no publishing)
        run: bash frontend/ci/bin/test-build-version-image.sh

  # The frontend image is published for linux/arm64 too (docs/adr/0043), but
  # `fast` builds and starts it on amd64 only. This job runs the same
  # shipped-image contract on an arm64 runner, so the arm64 nginx base, the
  # entrypoint script and both nginx configurations are started and checked on
  # arm64 before merge. The script builds its own image on this runner; the
  # published arm64 image is cross-built on amd64 from the same Dockerfile.
  # Node is only the script's JSON assertion tool; the frontend build itself
  # runs in the Docker build.
  frontend-image-arm64:
    name: frontend image (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'

      - name: Frontend image contract (build identity, both nginx configs, restricted runtime; no publishing)
        run: bash frontend/ci/bin/test-build-version-image.sh

  # The GraalVM native build plus the native @QuarkusIntegrationTest suite
  # (SshOsReleaseResourceIT et al. — see docs/adr/0025). `quarkusIntTest` boots
  # the freshly built native binary and exercises it over HTTP, so this job
  # gates on native-image regressions the JVM-mode `fast` job cannot see.
  #
  # One job per published architecture (docs/adr/0043). The publish workflows
  # run only on main and on tags, so these jobs are the only pre-merge proof
  # that each architecture's binary compiles and that its shipped image boots
  # on the UBI9 runtime. The runner images are pinned to the same pair that
  # build-images.yml compiles the published binaries on (glibc coupling, see
  # the comment there). fail-fast is off so that one architecture's failure
  # does not hide the other's result.
  native:
    name: native (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # GraalVM CE 25 matches the toolchain that builds the shipped native
      # image: project-environment/flake.nix pins `graalvmPackages.graalvm-ce`
      # (currently 25.0.0, i.e. JDK 25) and exports it as GRAALVM_HOME, and
      # Dockerfile.native-ci packages the binary built in that devshell. The
      # *bytecode* still targets 21 (build.gradle sourceCompatibility) — a
      # different axis from the native-image toolchain major.
      #
      # set-java-home: 'false' keeps JAVA_HOME free for the JDK 21 below:
      # Gradle 8.14.x cannot run ON JDK 25 (that needs Gradle 9.1+), so Gradle
      # runs on 21 while Quarkus picks up native-image from GRAALVM_HOME,
      # which it prefers over JAVA_HOME — the same split the devshell uses.
      - name: Set up GraalVM CE 25 (native-image toolchain)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          set-java-home: 'false'

      # Must run AFTER setup-graalvm so this JAVA_HOME (and PATH `java`) wins
      # for the Gradle launcher and test-harness JVMs.
      - name: Set up JDK 21 (Gradle launcher)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '8.14.4'

      # `quarkusIntTest` runs the @QuarkusIntegrationTest suite (e.g.
      # SshOsReleaseResourceIT, docs/adr/0025) against the artifact `build`
      # just produced. -Dquarkus.container-image.build=true (+ the
      # quarkus-container-image-docker extension, wired to Dockerfile.native-ci
      # via quarkus.docker.dockerfile-native-path in application.yml) makes
      # Quarkus build that exact image and boot *it* for the ITs instead of the
      # raw native executable, so a broken runtime image (e.g. a missing shared
      # library the binary needs but the image doesn't ship) fails this job
      # instead of shipping to prod undetected. -PcustomBuildDir=build-native
      # matches Dockerfile.native-ci's expected COPY source. Nothing is pushed —
      # the image is built into the local Docker daemon only.
      # -Dquarkus.package.jar.enabled=false skips packaging the redundant JVM
      # jar; -x test skips the JVM unit/integration suite the `fast` job owns.
      # Valkey comes from Quarkus Dev Services (this runner has Docker), same
      # as for `fast`'s test JVM.
      #
      # Booting the container (rather than the raw binary) means the ITs' host-side
      # test doubles (WireMock, the embedded SSH server, the Keycloak Testcontainer)
      # are no longer reachable on localhost from the artifact under test. The env +
      # /etc/hosts wiring below bridges that: PU2D_IT_CALLBACK_HOST makes the doubles
      # hand the container `host.docker.internal`; QUARKUS_TEST_ARG_LINE feeds Quarkus'
      # container launcher an --add-host so the container resolves that name to the host
      # gateway; and the /etc/hosts entry maps it to loopback for this test JVM, so the
      # OIDC issuer string is identical on both sides (the artifact validates the token's
      # `iss` against it, and this JVM fetches the token from it).
      - name: Map host.docker.internal to loopback (host-side test doubles)
        run: echo "127.0.0.1 host.docker.internal" | sudo tee -a /etc/hosts

      - name: Native build + native integration tests (against the shipped image)
        env:
          PU2D_IT_CALLBACK_HOST: host.docker.internal
          QUARKUS_TEST_ARG_LINE: --add-host=host.docker.internal:host-gateway
        run: >
          gradle --no-daemon :backend:build :backend:quarkusIntTest
          -Dquarkus.native.enabled=true
          -Dquarkus.package.jar.enabled=false
          -Dquarkus.container-image.build=true
          -PcustomBuildDir=build-native
          -PbuildVersion=1.2.3-rc.6+ci.1
          -PbuildVersionRequired=true
          -x test

  # Keeps deploy/k8s from rotting: kustomize-build every shipped composition
  # (base alone, the quickstart overlay, and base + each component — the rbac
  # component only composes at apply time, so CI fabricates the throwaway
  # overlay a user would write) and schema-validate the output against the
  # upstream Kubernetes OpenAPI schemas with kubeconform. Then check on a real
  # API server (kind) that the quickstart overlay passes the `restricted` Pod
  # Security Standard (docs/adr/0044). Schema validation cannot see that.
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Build and validate kustomizations
        run: |
          set -euo pipefail
          mkdir -p deploy/k8s/.ci-full
          cat > deploy/k8s/.ci-full/kustomization.yaml <<'EOF'
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          namespace: platformup2date
          resources:
            - ../base
          components:
            - ../components/valkey
            - ../components/rbac
          EOF
          for target in base overlays/quickstart .ci-full; do
            echo "--- kustomize build + kubeconform: deploy/k8s/$target"
            kubectl kustomize "deploy/k8s/$target" \
              | kubeconform -strict -summary
          done

      # kind and kubectl are part of the runner image. The script creates its
      # own cluster and deletes it.
      - name: Restricted Pod Security Standard (quickstart overlay)
        run: bash ci/check-restricted-pod-security.sh
