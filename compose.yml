services:
  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: src/main/docker/Dockerfile.jvm
    restart: unless-stopped
    environment:
      QUARKUS_REDIS_HOSTS: redis://valkey:6379
      QUARKUS_CONFIG_LOCATIONS: /config/platform-config.yaml
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ./deploy/k8s/base/platform-config.yaml:/config/platform-config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/q/health/ready"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

  frontend:
    container_name: frontend
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      # Browser requests stay same-origin; nginx forwards /api to the backend.
      API_BASE_URL: ""
    volumes:
      - ./frontend/nginx.quickstart.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3000:80"
    command:
      - /bin/sh
      - -c
      - echo "PlatformUp2Date is available at http://localhost:3000" && exec nginx -g 'daemon off;'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/api/v1/version"]
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 5s
